base_local_planner: base_local_planner/TrajectoryPlannerROS

TrajectoryPlannerROS:

  max_vel_x: 0.25
  min_vel_x: 0.05

  max_vel_theta: 0.8
  min_in_place_vel_theta: 0.3

  acc_lim_x: 0.5
  acc_lim_theta: 1.0

  holonomic_robot: false

  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.15

  latch_xy_goal_tolerance: false
